name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest SSA names.zip
        run: |
          set -euo pipefail
          mkdir -p data_src
          curl -fsSL -o /tmp/names.zip https://www.ssa.gov/oact/babynames/names.zip
          unzip -oq /tmp/names.zip -d data_src
          find data_src -type f ! -name 'yob*.txt' -delete
          ls data_src | head -5
          echo "files: $(ls data_src | wc -l)"

      - name: Rebuild data and SEO pages
        run: |
          python -m pip install --quiet --upgrade pip
          python scripts/build_data.py
          python scripts/build_pages.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
